[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  NEXT_PUBLIC_BASE_URL = "https://hh-goa-2026-task1.netlify.app"

# Netlify detects Next.js and applies the OpenNext adapter automatically, so no
# plugin is pinned here — pinning would opt the site out of adapter updates.

[dev]
  command = "npm run dev"
  targetPort = 3000
